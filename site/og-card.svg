<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Fredoka','Nunito Sans',sans-serif">
  <defs>
    <clipPath id="round"><rect width="1200" height="630" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <!-- fundo creme -->
    <rect width="1200" height="630" fill="#FFF8EE"/>
    <!-- círculos decorativos -->
    <circle cx="1120" cy="60" r="340" fill="#FFE2D1" opacity="0.6"/>
    <circle cx="1080" cy="640" r="200" fill="#CBF54D" opacity="0.35"/>
    <!-- logo -->
    <g transform="translate(88,86)">
      <rect width="72" height="72" rx="18" fill="#FF6B4A"/>
      <path d="M36 13 L40.5 31.5 L59 36 L40.5 40.5 L36 59 L31.5 40.5 L13 36 L31.5 31.5 Z" fill="#FFF8EE"/>
      <text x="90" y="52" font-size="44" font-weight="600" fill="#10403F">Ponto<tspan fill="#FF6B4A">Snap</tspan></text>
    </g>
    <!-- tagline -->
    <text x="90" y="330" font-size="56" font-weight="600" fill="#10403F">Seu time bate ponto pelo celular.</text>
    <text x="90" y="398" font-size="56" font-weight="600" fill="#10403F">Você fecha o mês em minutos.</text>
    <!-- subtítulo -->
    <text x="92" y="452" font-size="26" font-weight="600" fill="#5C4F49" font-family="'Nunito Sans',sans-serif">Ponto eletrônico REP-P pra empresas CLT. Sem relógio na parede.</text>
    <!-- selo -->
    <g transform="translate(90,510)">
      <rect width="470" height="52" rx="26" fill="#10403F"/>
      <path d="M34 26 l7 7 l13 -14" stroke="#CBF54D" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="250" y="34" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="'Nunito Sans',sans-serif">Conforme Portaria MTP 671/2021</text>
    </g>
  </g>
</svg>
