  <script>
    // Versão nova publicada e o aparelho ainda com a página antiga em cache
    // (service worker): o JS antigo não existe mais e a tela fica em branco.
    // Se o script principal falhar, limpa o cache do app e recarrega UMA vez.
    (function () {
      var CHAVE = 'pontosnap.recuperou';
      function recuperar() {
        try { if (sessionStorage.getItem(CHAVE)) return; sessionStorage.setItem(CHAVE, '1'); } catch (e) { return; }
        var p = [];
        if ('serviceWorker' in navigator) p.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
        if (window.caches) p.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
        Promise.all(p).catch(function () {}).then(function () { location.reload(); });
      }
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT' && /\/assets\//.test(t.src || '')) recuperar();
      }, true);
      window.addEventListener('vite:preloadError', function () { recuperar(); });
    })();
  </script>
